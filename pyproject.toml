[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-rl-benchmark"
version = "0.1.0"
description = "Reproducible CartPole benchmarks: random, physics heuristic, and neural-network policy search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium[classic-control]>=1.0,<2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cartpole-benchmark = "cartpole_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
